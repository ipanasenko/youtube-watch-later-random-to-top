name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # npm refuses to install the package off macOS because of "os" in package.json.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm test

      - name: Install the packed CLI and run it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global "$RUNNER_TEMP"/ipanasenko-wl-random-*.tgz
          wl-random --help
